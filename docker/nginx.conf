# docker/nginx.conf — sajikan SPA Vue dengan fallback history mode + cache aset.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history mode: semua path tak dikenal → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash dari Vite: cache panjang & immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
